plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.locationforeground'
version = '0.1.0'

android {
  namespace "expo.modules.locationforeground"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "com.google.android.gms:play-services-location:21.3.0"
}
